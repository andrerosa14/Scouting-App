<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scouting Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#12271f;
    --pitch-panel:#1a3a2c;
    --pitch-panel-raise:#204634;
    --line:#365848;
    --line-soft:#2a4738;
    --chalk:#f1eee3;
    --muted:#93a89b;
    --gold:#c99a44;
    --gold-dim:#8a713f;
    --blue:#7396a8;
    --olive:#a6b184;
    --terracotta:#c15b41;
    --success:#5f9260;
    --status-approved:#5f9260;
    --status-urgent:#8fc17f;
    --status-follow:#d7b23c;
    --status-rejected:#c1453f;
    --st-cat-second:#bfe0a8;
    --radius:4px;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--pitch-dark);color:var(--chalk);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--gold-dim);color:var(--chalk);}
  input,select,textarea,button{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }

  /* ---------- header ---------- */
  header{position:relative;padding:28px 24px 22px;border-bottom:1px solid var(--line);}
  .motif{position:absolute;inset:0;pointer-events:none;opacity:.16;}
  .header-inner{position:relative;max-width:1100px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.03em;margin:0;color:var(--chalk);}
  .brand span{color:var(--muted);font-size:13px;}
  .header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-box{position:relative;}
  .search-box input{background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px 9px 32px;color:var(--chalk);width:220px;font-size:14px;}
  .search-box input::placeholder{color:var(--muted);}
  .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6;}
  .search-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;width:320px;background:var(--pitch-panel-raise);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:30;max-height:360px;overflow-y:auto;}
  .sd-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px 4px;}
  .sd-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;}
  .sd-item:hover{background:var(--pitch-panel);}
  .sd-badge{width:30px;height:30px;border-radius:var(--radius);font-size:12px;flex-shrink:0;}
  .sd-club-badge{width:30px;height:30px;border-radius:50%;background:var(--pitch-panel);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;overflow:hidden;}
  .sd-club-badge img{width:100%;height:100%;object-fit:cover;}
  .sd-name{font-weight:600;font-size:13px;}
  .sd-sub{font-size:12px;color:var(--muted);}
  .sd-empty{padding:12px 14px;font-size:13px;color:var(--muted);}
  .btn{border:1px solid var(--line);background:var(--pitch-panel);color:var(--chalk);padding:9px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;transition:background .15s, border-color .15s;}
  .btn:hover{border-color:var(--gold-dim);}
  .btn-primary{background:var(--gold);border-color:var(--gold);color:#1a1305;font-weight:600;}
  .btn-primary:hover{background:#d9ab54;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px;}
  .btn-ghost:hover{color:var(--chalk);}
  .btn-export{border:1px solid var(--gold-dim);background:rgba(201,154,68,.12);color:var(--gold);}
  .btn-export:hover{background:rgba(201,154,68,.2);}
  .btn-danger{border-color:var(--terracotta);color:var(--terracotta);background:transparent;}
  .btn-danger:hover{background:rgba(193,91,65,.12);}

  /* ---------- home tiles ---------- */
  .home-wrap{max-width:1100px;margin:0 auto;padding:56px 24px 80px;}
  .home-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;}
  .tile{
    width:320px;height:180px;
    background:#eceae4;
    border:1px solid #dcd9cf;
    border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:background .15s, border-color .15s, transform .15s, box-shadow .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .tile:hover{border-color:var(--gold-dim);transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.2);}
  .tile-icon{width:52px;height:52px;border-radius:50%;background:var(--pitch-panel-raise);border:1px solid var(--pitch-dark);display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .tile:hover .tile-icon{border-color:var(--gold-dim);}
  .tile-label{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.02em;color:#000000;}
  .tile-count{font-size:12px;color:#7a7a72;}

  /* ---------- home urgent watchlist panel ---------- */
  .home-urgent-wrap{max-width:1100px;margin:24px auto 0;padding:0 24px;}
  .urgent-panel{width:100%;background:var(--pitch-panel);border:1px solid var(--status-urgent);border-radius:var(--radius);overflow:hidden;}
  .urgent-panel-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-soft);}
  .urgent-panel-head svg{color:var(--status-urgent);flex-shrink:0;}
  .urgent-panel-title{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--chalk);}
  .urgent-panel-count{margin-left:auto;font-size:12px;color:var(--status-urgent);border:1px solid var(--status-urgent);border-radius:12px;padding:2px 10px;font-weight:600;white-space:nowrap;}
  .urgent-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:1px;background:var(--line-soft);}
  .urgent-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;background:var(--pitch-panel);border:none;cursor:pointer;color:inherit;font:inherit;}
  .urgent-card:hover{background:var(--pitch-panel-raise);}
  .urgent-card-avatar{width:48px;height:48px;border-radius:6px;background:var(--pitch-panel-raise);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);overflow:hidden;}
  .urgent-card-avatar img{width:100%;height:100%;object-fit:cover;}
  .urgent-card-name{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .urgent-card-club{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .urgent-card-birth{font-size:10px;color:var(--muted);opacity:.85;white-space:nowrap;}
  .urgent-card-meta{display:flex;align-items:center;gap:5px;margin-top:2px;}
  .urgent-card-lvl{width:18px;height:18px;border-radius:4px;background:var(--status-approved);color:#0d1f10;font-family:var(--font-display);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .urgent-card-pos{background:var(--pitch-panel-raise);border:1px solid var(--line-soft);border-radius:3px;padding:1px 5px;font-weight:600;color:var(--chalk);font-size:10px;}
  .urgent-card-time{font-size:10px;color:var(--status-urgent);margin-top:1px;}
  .urgent-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
  .urgent-toggle{display:block;width:100%;text-align:center;padding:12px 20px;background:var(--pitch-panel-raise);border:none;border-top:1px solid var(--line-soft);color:var(--gold);font-size:13px;font-weight:600;}
  .urgent-toggle:hover{background:var(--line-soft);}

  /* ---------- Nível de Urgência tab ---------- */
  .lvltab-panel{width:100%;background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .lvltab-filter-row{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
  .lvltab-filter-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-right:4px;}
  .lvltab-filter-btn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 16px;border-radius:var(--radius);font-family:var(--font-display);font-weight:600;font-size:13px;}
  .lvltab-filter-btn.active{background:var(--pitch-panel-raise);border-color:var(--gold-dim);color:var(--chalk);}
  .lvltab-filter-btn.lvl-a.active{border-color:var(--status-approved);color:var(--status-approved);}
  .lvltab-filter-btn.lvl-b.active{border-color:var(--status-urgent);color:var(--status-urgent);}
  .lvltab-filter-btn.lvl-c.active{border-color:var(--status-follow);color:var(--status-follow);}
  .lvltab-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:1px;background:var(--line-soft);}
  .lvltab-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;background:var(--pitch-panel);border:none;cursor:pointer;color:inherit;font:inherit;}
  .lvltab-card:hover{background:var(--pitch-panel-raise);}
  .lvltab-card-avatar{width:48px;height:48px;border-radius:6px;background:var(--pitch-panel-raise);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);overflow:hidden;}
  .lvltab-card-avatar img{width:100%;height:100%;object-fit:cover;}
  .lvltab-card-name{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .lvltab-card-club{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .lvltab-card-birth{font-size:10px;color:var(--muted);opacity:.85;white-space:nowrap;}
  .lvltab-card-meta{display:flex;align-items:center;gap:5px;margin-top:2px;}
  .lvltab-card-lvl{width:18px;height:18px;border-radius:4px;color:#0d1f10;font-family:var(--font-display);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .lvltab-card-lvl.lvl-a{background:var(--status-approved);}
  .lvltab-card-lvl.lvl-b{background:var(--status-urgent);}
  .lvltab-card-lvl.lvl-c{background:var(--status-follow);color:#2a2005;}
  .lvltab-card-pos{background:var(--pitch-panel-raise);border:1px solid var(--line-soft);border-radius:3px;padding:1px 5px;font-weight:600;color:var(--chalk);font-size:10px;}
  .lvltab-card-time{font-size:10px;color:var(--muted);margin-top:1px;}
  .lvltab-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}

  /* ---------- Sistemas Táticos tab ---------- */
  .ts-form-team-block{border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;position:relative;}
  .ts-form-team-remove{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;}
  .ts-form-team-remove:hover{color:var(--chalk);}
  .ts-form-team-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);margin-bottom:10px;font-weight:600;}
  .ts-add-team-btn{width:100%;border:1px dashed var(--gold-dim);background:transparent;color:var(--gold);border-radius:var(--radius);padding:9px;font-size:13px;font-weight:600;margin-top:4px;}
  .ts-add-team-btn:hover{background:var(--pitch-panel-raise);}

  .ts-detail-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .ts-detail-title{font-family:var(--font-display);font-size:20px;font-weight:600;}
  .ts-detail-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .ts-formation-tag{background:var(--pitch-panel-raise);border:1px solid var(--gold-dim);color:var(--gold);border-radius:12px;padding:3px 12px;font-size:12px;font-weight:600;font-family:var(--font-display);white-space:nowrap;}

  /* nowrap + scroll horizontal: as equipas ficam SEMPRE lado a lado, mesmo em ecrãs mais estreitos (nunca voltam a empilhar) */
  .ts-teams-wrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;padding-bottom:26px;}
  .ts-team-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:nowrap;flex-shrink:0;}
  .ts-pitch-col{width:400px;flex-shrink:0;}
  .ts-pitch-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .ts-pitch-col-title{font-family:var(--font-display);font-weight:600;font-size:15px;}

  .ts-pitch-wrap{position:relative;width:100%;aspect-ratio:3/5;background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);overflow:visible;}
  .ts-pitch-lines{position:absolute;inset:0;width:100%;height:100%;}
  .ts-slot{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .ts-slot-badge{width:30px;height:30px;border-radius:50%;background:var(--pitch-panel-raise);border:2px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--chalk);}
  .ts-slot.filled .ts-slot-badge{border-color:var(--status-approved);background:var(--status-approved);color:#0d1f10;}
  .ts-slot.oldest .ts-slot-badge{border-color:var(--status-follow);background:var(--status-follow);color:#2a2005;}
  .ts-slot.oldest .ts-slot-year{border-color:var(--status-follow);background:var(--status-follow);color:#2a2005;}
  .ts-slot-pos{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .ts-slot-year{font-size:11px;font-weight:700;color:var(--chalk);background:var(--pitch-panel-raise);border:1px solid var(--line-soft);border-radius:3px;padding:0 6px;line-height:17px;min-width:16px;text-align:center;}
  .ts-slot-inputs{display:flex;gap:3px;margin-top:1px;}
  .ts-slot-inputs input{width:32px;background:rgba(18,39,31,.9);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font-size:11.5px;text-align:center;padding:2px 1px;}
  .ts-slot-inputs input.ts-year-input{width:40px;}
  .ts-slot-actions{display:flex;align-items:center;gap:6px;margin-top:1px;}
  .ts-slot-note-btn{font-size:9.5px;color:var(--gold);background:none;border:none;padding:1px 3px;}
  .ts-slot-star-btn{font-size:11px;color:var(--gold-dim);background:none;border:none;padding:0 3px;line-height:1;}
  .ts-slot-star-btn.active{color:var(--status-follow);}
  .ts-slot-note-box{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;width:140px;background:var(--pitch-panel-raise);border:1px solid var(--gold-dim);border-radius:4px;padding:6px;z-index:5;}
  .ts-slot-note-box textarea{width:100%;height:48px;background:rgba(18,39,31,.9);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font-size:11px;padding:4px;resize:none;}
  .ts-slot-note-has{color:var(--gold);}
  /* modo de colocação: quando há um jogador selecionado na lista "por colocar", as posições vazias ficam com contorno tracejado a pulsar */
  .ts-slot.placeable{cursor:pointer;}
  .ts-slot.placeable .ts-slot-badge{border-style:dashed;border-color:var(--gold);animation:tsPulse 1.1s ease-in-out infinite;}
  @keyframes tsPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,154,68,.45);}50%{box-shadow:0 0 0 5px rgba(201,154,68,0);}}

  .ts-pending-panel{width:200px;flex-shrink:0;background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;align-self:stretch;display:flex;flex-direction:column;}
  .ts-pending-title{font-family:var(--font-display);font-weight:600;font-size:13px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ts-pending-count{font-size:11px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:10px;padding:1px 8px;flex-shrink:0;}
  .ts-pending-paste{margin-bottom:10px;}
  .ts-pending-paste textarea{width:100%;height:56px;background:var(--pitch-panel-raise);border:1px solid var(--line);border-radius:var(--radius);color:var(--chalk);font-size:12px;padding:7px 8px;resize:none;}
  .ts-pending-paste-hint{font-size:10.5px;color:var(--muted);margin:4px 0 8px;}
  .ts-pending-paste-btn{width:100%;border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:var(--radius);padding:7px;font-size:12px;font-weight:600;}
  .ts-pending-paste-btn:hover{background:var(--pitch-panel-raise);}
  .ts-pending-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .ts-pending-chip{display:flex;align-items:center;gap:6px;background:var(--pitch-panel-raise);border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 10px;font-size:12px;font-weight:600;cursor:pointer;}
  .ts-pending-chip:hover{border-color:var(--gold-dim);}
  .ts-pending-chip.selected{background:var(--gold);border-color:var(--gold);color:#241a06;}
  .ts-pending-chip-x{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;}
  .ts-pending-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 4px;}
  .ts-pending-hint{margin-top:12px;background:rgba(201,154,68,.12);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:8px 10px;font-size:11.5px;color:var(--gold);}

  .ts-legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .ts-legend span{display:inline-flex;align-items:center;gap:5px;}
  .ts-legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}

  /* ---------- home stats strip ---------- */
  .home-stats-wrap{max-width:1100px;margin:34px auto 0;padding:0 24px;}
  .home-stats-strip{display:flex;flex-wrap:wrap;gap:14px;}
  .stat-card{flex:1;min-width:145px;background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat-card .stat-num{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;}
  .stat-card .stat-label{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em;}
  .stat-card.st-approved .stat-num{color:var(--status-approved);}
  .stat-card.st-urgent .stat-num{color:var(--status-urgent);}
  .stat-card.st-follow .stat-num{color:var(--status-follow);}
  .stat-card.st-rejected .stat-num{color:var(--status-rejected);}
  .stat-card.st-month .stat-num{color:var(--gold);}

  /* ---------- home insight panels ---------- */
  .home-insights-wrap{max-width:1100px;margin:18px auto 80px;padding:0 24px;}
  .insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .insight-panel{background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .insight-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft);}
  .insight-head svg{color:var(--gold);flex-shrink:0;}
  .insight-title{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;}
  .insight-count{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line-soft);border-radius:12px;padding:2px 9px;white-space:nowrap;}
  .insight-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-soft);}
  .insight-row:last-child{border-bottom:none;}
  .insight-row .ii-main{flex:1;min-width:0;}
  .insight-row .ii-title{font-weight:600;font-size:13.5px;}
  .insight-row .ii-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .insight-tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:12px;border:1px solid;white-space:nowrap;flex-shrink:0;}
  .insight-tag.warn{color:var(--status-follow);border-color:var(--status-follow);}
  .insight-tag.danger{color:var(--status-rejected);border-color:var(--status-rejected);}
  .insight-tag.overdue{color:var(--status-rejected);border-color:var(--status-rejected);}
  .insight-tag.neutral{color:var(--muted);border-color:var(--line-soft);}
  .insight-tag.gold{color:var(--gold);border-color:var(--gold-dim);}
  .insight-empty{padding:16px 18px;color:var(--muted);font-size:13px;}
  .insight-check-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-soft);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight-check-btn:hover{border-color:var(--status-approved);color:var(--status-approved);background:rgba(95,146,96,.12);}

  @media (max-width:720px){
    .insights-grid{grid-template-columns:1fr;}
  }

  /* ---------- section back bar ---------- */
  .section-back-bar{max-width:1100px;margin:0 auto;padding:16px 24px;border-bottom:1px solid var(--line);}

  @keyframes tabFadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .tab-fade{animation:tabFadeIn .32s ease;}

  /* ---------- shell / filters ---------- */
  .shell{max-width:1100px;margin:0 auto;padding:20px 24px 80px;}
  .shell.shell-wide{max-width:1320px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:14px;background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);}
  .filters .label{font-size:12px;color:var(--muted);margin-right:2px;}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;border-radius:var(--radius);font-size:13px;font-weight:600;}
  .chip.active{background:var(--gold);border-color:var(--gold);color:#1a1305;}
  select.filter-select{background:var(--pitch-panel-raise);border:1px solid var(--line);color:var(--chalk);padding:7px 10px;border-radius:var(--radius);font-size:13px;}
  .filters .spacer{flex:1;}
  .count-label{font-size:13px;color:var(--muted);}

  /* ---------- list ---------- */
  .list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
  .row{display:grid;grid-template-columns:44px 1.3fr 0.85fr 60px 190px 180px;gap:14px;align-items:center;background:var(--pitch-panel);padding:12px 14px;text-align:left;border:none;width:100%;}
  .row:hover{background:var(--pitch-panel-raise);}
  .badge{width:38px;height:38px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:14px;color:#12271f;}
  .b-GR{background:var(--gold);} .b-DF{background:var(--blue);} .b-MC{background:var(--olive);} .b-AV{background:var(--terracotta);color:#2a120a;}
  .row .name{font-weight:600;font-size:15px;}
  .row .club{color:var(--muted);font-size:13px;}
  .row .pos-tag{font-size:12px;color:var(--muted);font-weight:600;}
  .row .age{color:var(--muted);font-size:13px;min-width:0;white-space:normal;line-height:1.3;}
  .stars{display:flex;gap:2px;}
  .status-pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;border:1px solid;text-align:center;white-space:nowrap;}
  .st-approved{color:var(--status-approved);border-color:var(--status-approved);}
  .st-urgent{color:var(--status-urgent);border-color:var(--status-urgent);}
  .st-follow{color:var(--status-follow);border-color:var(--status-follow);}
  .st-rejected{color:var(--status-rejected);border-color:var(--status-rejected);}

  .empty{padding:64px 24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}
  .empty h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 8px;}
  .empty p{color:var(--muted);margin:0 0 18px;}

  /* ---------- modal (add player) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,16,12,.68);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px;}
  .modal h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;background:var(--pitch-panel-raise);border:1px solid var(--line);color:var(--chalk);padding:9px 10px;border-radius:var(--radius);font-size:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* ---------- dossier ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(8,16,12,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .dossier{position:fixed;top:0;left:0;height:100%;width:100%;background:var(--pitch-dark);transform:translateX(100%);transition:transform .25s ease;z-index:45;overflow-y:auto;}
  .dossier.open{transform:translateX(0);}
  .dossier-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--pitch-dark);z-index:1;}
  .dossier-body{padding:26px 24px 80px;max-width:1100px;margin:0 auto;}
  .dossier-id{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  .dossier-badge{width:56px;height:56px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:#12271f;flex-shrink:0;}
  .dossier-name{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 4px;}
  .tag-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line-soft);padding:3px 9px;border-radius:12px;}
  .club-update-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .modal-sub{font-size:13px;color:var(--muted);margin:-10px 0 18px;}
  .search-link{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);text-decoration:none;margin-bottom:18px;border:1px solid var(--gold-dim);border-radius:var(--radius);padding:8px 12px;background:var(--pitch-panel-raise);width:100%;justify-content:center;box-sizing:border-box;}
  .search-link:hover{background:var(--line-soft);}

  .section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .section h3{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em;margin:0 0 12px;color:var(--chalk);}
  .status-select-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip.st-approved{border-color:var(--status-approved);color:var(--status-approved);}
  .chip.st-urgent{border-color:var(--status-urgent);color:var(--status-urgent);}
  .chip.st-follow{border-color:var(--status-follow);color:var(--status-follow);}
  .chip.st-rejected{border-color:var(--status-rejected);color:var(--status-rejected);}
  .chip.active.st-approved{background:var(--status-approved);color:#0d1f10;}
  .chip.active.st-urgent{background:var(--status-urgent);color:#0d1f10;}
  .chip.active.st-follow{background:var(--status-follow);color:#2a2005;}
  .chip.active.st-rejected{background:var(--status-rejected);color:#2a0d0a;}

  .rating-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .stars button{background:none;border:none;padding:2px;line-height:0;}

  .basic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;}
  .basic-grid dt{color:var(--muted);margin-bottom:2px;}
  .basic-grid dd{margin:0 0 8px;}

  .note{background:var(--pitch-panel-raise);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .note.t-final{border-color:var(--gold-dim);}
  .note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
  .note-head-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .note-date{font-size:12px;color:var(--muted);font-weight:600;}
  .note-type-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;border:1px solid;white-space:nowrap;}
  .note-type-pill.t-nota{color:var(--muted);border-color:var(--line-soft);}
  .note-type-pill.t-final{color:var(--gold);border-color:var(--gold-dim);}
  .note.t-nivel.lvl-a{border-color:var(--status-approved);}
  .note.t-nivel.lvl-b{border-color:var(--status-urgent);}
  .note.t-nivel.lvl-c{border-color:var(--status-follow);}
  .note-type-pill.t-nivel.lvl-a{color:var(--status-approved);border-color:var(--status-approved);}
  .note-type-pill.t-nivel.lvl-b{color:var(--status-urgent);border-color:var(--status-urgent);}
  .note-type-pill.t-nivel.lvl-c{color:var(--status-follow);border-color:var(--status-follow);}
  .note p{margin:0;font-size:14px;white-space:pre-wrap;}
  .note-form textarea{width:100%;background:var(--pitch-panel-raise);border:1px solid var(--line);color:var(--chalk);border-radius:var(--radius);padding:10px;font-size:14px;min-height:70px;resize:vertical;margin-top:10px;}
  .note-form{margin-bottom:14px;}
  .note-form-actions{display:flex;justify-content:flex-end;margin-top:8px;}

  /* ---------- collapsed final-evaluation reports ---------- */
  .note.t-final .note-body{position:relative;cursor:pointer;}
  .note.t-final .note-body.collapsed p{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .note.t-final .note-body.collapsed::after{
    content:'';position:absolute;left:0;right:0;bottom:22px;height:26px;
    background:linear-gradient(to bottom, rgba(32,70,52,0), var(--pitch-panel-raise));
    pointer-events:none;
  }
  .note-expand-toggle{
    display:flex;align-items:center;gap:5px;margin-top:8px;background:none;border:none;
    color:var(--gold);font-size:12px;font-weight:600;padding:0;
  }
  .note-expand-toggle svg{transition:transform .15s;}
  .note-expand-toggle.is-open svg{transform:rotate(180deg);}

  .danger-zone{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);text-align:right;}

  /* ---------- photos / clubs ---------- */
  .photo-preview{margin-top:8px;width:160px;height:120px;border:1px dashed var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--pitch-panel-raise);}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-preview-empty{color:var(--muted);font-size:12px;text-align:center;padding:8px;}
  .photo-preview-round{border-radius:50%;width:96px;height:96px;}
  .photo-remove-label{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);}

  .club-logo-mini{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .row .club{display:flex;align-items:center;gap:6px;}

  .inline-club-form{margin-top:8px;padding:10px;background:var(--pitch-panel-raise);border:1px solid var(--line);border-radius:var(--radius);}
  .inline-club-form .field{margin-bottom:8px;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:12px;font-weight:600;padding:4px 0;text-decoration:underline;}

  .club-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .club-row:last-child{border-bottom:none;}
  .club-row-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--pitch-panel-raise);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted);}
  .club-row-avatar img{width:100%;height:100%;object-fit:cover;}
  .club-row-info{flex:1;min-width:0;}
  .club-row-name-line{display:flex;align-items:center;gap:8px;}
  .club-row-name{font-weight:600;font-size:14px;}
  .club-row-count{font-size:12px;color:var(--muted);}
  .club-row-open{background:none;border:none;padding:0;display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;cursor:pointer;color:inherit;font:inherit;}
  .club-row-avatar.is-natl{background:rgba(115,150,168,.18);border-color:var(--blue);}
  .natl-tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--blue);border:1px solid var(--blue);padding:1px 7px;border-radius:10px;text-transform:uppercase;flex-shrink:0;}

  /* ---------- club/seleção form: tipo ---------- */
  .type-toggle{display:flex;gap:8px;}
  .type-toggle label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;font-size:13px;background:var(--pitch-panel-raise);color:var(--muted);cursor:pointer;}
  .type-toggle input{display:none;}
  .type-toggle input:checked + span{color:var(--chalk);}
  .type-toggle label:has(input:checked){border-color:var(--gold-dim);background:rgba(201,154,68,.12);}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---------- club detail page ---------- */
  .club-hero{display:flex;align-items:center;gap:18px;margin-bottom:28px;}
  .club-hero-avatar{width:64px;height:64px;border-radius:50%;background:var(--pitch-panel-raise);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--muted);overflow:hidden;flex-shrink:0;}
  .club-hero-avatar img{width:100%;height:100%;object-fit:cover;}
  .club-hero-avatar.is-natl{background:rgba(115,150,168,.18);border-color:var(--blue);}
  .club-hero-name-line{display:flex;align-items:center;gap:10px;}
  .club-hero-name{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 4px;}
  .club-hero-count{font-size:13px;color:var(--muted);}

  /* ---------- seleção: lista de jogos observados ---------- */
  .game-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;color:inherit;font:inherit;}
  .game-row:last-child{border-bottom:none;}
  .game-row-avatar{width:36px;height:36px;border-radius:50%;background:var(--pitch-panel-raise);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;overflow:hidden;}
  .game-row-avatar img{width:100%;height:100%;object-fit:cover;}
  .game-row-info{flex:1;min-width:0;}
  .game-row-name{font-weight:600;font-size:14px;}
  .game-row-sub{font-size:12px;color:var(--muted);}
  .club-player-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line);display:flex;flex-direction:column;gap:1px;}
  .club-player-row{display:flex;align-items:center;gap:14px;background:var(--pitch-panel);padding:12px 16px;cursor:pointer;transition:background .15s;width:100%;text-align:left;border:none;color:inherit;font:inherit;}
  .club-player-row:hover{background:var(--pitch-panel-raise);}
  .cpr-photo{width:44px;height:56px;border-radius:5px;overflow:hidden;background:var(--pitch-panel-raise);border:1px solid var(--line-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);}
  .cpr-photo img{width:100%;height:100%;object-fit:cover;}
  .cpr-info{flex:1;min-width:0;}
  .cpr-name{font-weight:600;font-size:14px;}
  .cpr-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .cpr-meta .pos-badge{background:var(--pitch-panel-raise);border:1px solid var(--line-soft);border-radius:3px;padding:1px 6px;font-weight:600;color:var(--chalk);font-size:11px;}
  .cpr-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;border:1px solid;text-align:center;white-space:nowrap;flex-shrink:0;}
  .cpr-arrow{color:var(--muted);flex-shrink:0;}

  .ct-ok{color:var(--success);border-color:var(--success);}
  .ct-soon{color:var(--gold);border-color:var(--gold-dim);}
  .ct-expired{color:var(--terracotta);border-color:var(--terracotta);}

  /* ---------- per-player game notes ---------- */
  .player-report-card{background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .player-card-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;}
  .player-card-photo{width:64px;height:82px;border-radius:6px;overflow:hidden;background:var(--pitch-panel-raise);border:1px solid var(--line-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--muted);}
  .player-card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .player-card-body{flex:1;min-width:0;}
  .player-card-name{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 6px;}
  .player-card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);}
  .player-card-meta .pos-badge{background:var(--pitch-panel-raise);border:1px solid var(--line-soft);border-radius:3px;padding:2px 6px;font-weight:600;color:var(--chalk);font-size:11px;}
  .player-card-meta .sep{opacity:.5;}
  .player-card-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-left:auto;flex-shrink:0;}
  .player-card-count{font-size:12px;color:var(--muted);}
  .player-card-status-row{margin-bottom:14px;}
  .player-card-status-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:6px;}
  .player-card-status-hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .lvl-row{display:flex;gap:8px;}
  .lvl-chip{border:1px solid var(--line);background:transparent;color:var(--muted);width:46px;height:38px;border-radius:var(--radius);font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .lvl-chip.lvl-a{border-color:var(--status-approved);color:var(--status-approved);}
  .lvl-chip.lvl-b{border-color:var(--status-urgent);color:var(--status-urgent);}
  .lvl-chip.lvl-c{border-color:var(--status-follow);color:var(--status-follow);}
  .lvl-chip.active.lvl-a{background:var(--status-approved);color:#0d1f10;}
  .lvl-chip.active.lvl-b{background:var(--status-urgent);color:#0d1f10;}
  .lvl-chip.active.lvl-c{background:var(--status-follow);color:#2a2005;}

  /* ---------- clubs tab / shortlists ---------- */
  .club-list-panel{background:var(--pitch-panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px;}

  .shortlist-row{display:flex;align-items:center;gap:14px;background:var(--pitch-panel);padding:12px 14px;cursor:pointer;}
  .shortlist-row:hover{background:var(--pitch-panel-raise);}
  .shortlist-row .info{flex:1;min-width:0;}
  .sl-name{font-weight:600;font-size:15px;}
  .sl-count{font-size:13px;color:var(--muted);margin-top:2px;}

  .shortlist-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .shortlist-detail-title{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 16px;}

  /* ---------- shadow teams (pitch graphic) ---------- */
  .pitch-wrap{position:relative;background:#d9e8d3;border:1px solid #bcd4b3;border-radius:var(--radius);padding:28px 16px;overflow:hidden;}
  .pitch-lines{position:absolute;inset:0;opacity:.5;pointer-events:none;}
  .pitch-grid{position:relative;display:grid;grid-template-columns:repeat(5, 1fr);gap:16px;}
  .pitch-slot{background:var(--pitch-panel);border:1px dashed var(--line-soft);border-radius:var(--radius);padding:8px;min-width:0;}
  .ps-ee{grid-column:1;grid-row:1;} .ps-pl{grid-column:3;grid-row:1;} .ps-ed{grid-column:5;grid-row:1;}
  .ps-sa{grid-column:3;grid-row:2;}
  .ps-mc{grid-column:2;grid-row:3;} .ps-moc{grid-column:4;grid-row:3;}
  .ps-mdc{grid-column:3;grid-row:4;}
  .ps-de{grid-column:1;grid-row:5;} .ps-dce{grid-column:2;grid-row:5;} .ps-dcd{grid-column:4;grid-row:5;} .ps-dd{grid-column:5;grid-row:5;}
  .ps-gr{grid-column:3;grid-row:6;}
  @media (max-width:900px){
    .pitch-grid{grid-template-columns:repeat(5, minmax(110px,1fr));overflow-x:auto;}
  }
  .pitch-slot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);}
  .pitch-slot-pos{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--gold);}
  .pitch-slot-count{font-size:10.5px;color:var(--muted);}

function timeAgo(ts){
  if(!ts) return '';
  const diffMs = Date.now() - ts;
  const diffDays = Math.floor(diffMs / (1000*60*60*24));
  if(diffDays <= 0) return 'hoje';
  if(diffDays === 1) return 'há 1 dia';
  if(diffDays < 7) return `há ${diffDays} dias`;
  const diffWeeks = Math.floor(diffDays / 7);
  if(diffWeeks === 1) return 'há 1 semana';
  if(diffWeeks < 5) return `há ${diffWeeks} semanas`;
  const diffMonths = Math.floor(diffDays / 30);
  if(diffMonths === 1) return 'há 1 mês';
  if(diffMonths < 12) return `há ${diffMonths} meses`;
  const diffYears = Math.floor(diffDays / 365);
  return diffYears === 1 ? 'há 1 ano' : `há ${diffYears} anos`;
}
function calcAge(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+'T00:00:00');
  if(isNaN(b.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && now.getDate() < b.getDate())) age--;
  return age;
}

}

  const now = new Date();
  const diffDays = Math.ceil((end - now) / (1000*60*60*24));

  if(diffDays <= 90) return {label:'Termina em breve', cls:'ct-soon'};

/* ---------------- image handling (photos / logos) ---------------- */
function fileToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('READ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('IMG'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- GitHub-backed storage ---------------- */
const CONFIG_KEY = 'scouting_gh_config_v1';
const GH_API = 'https://api.github.com';
const DATA_PATH = 'players.json';
let ghConfig = null;   // {owner, repo, token} — sempre opera no branch por omissão do repositório
let ghSha = null;      // sha of the current players.json, null if it doesn't exist yet

function loadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveConfig(cfg){
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}
function clearConfig(){
  localStorage.removeItem(CONFIG_KEY);
}

function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64ToUtf8(b64){
  const binary = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghRequest(path, options={}){
  return fetch(`${GH_API}${path}`, {
    ...options,
    cache: 'no-store',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${ghConfig.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers||{}),
    },
  });
}
function contentsPath(bustCache){
  const base = `/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${DATA_PATH}`;
  return bustCache ? `${base}?_=${Date.now()}` : base;
}

async function fetchDataFromGitHub(){
  const res = await ghRequest(contentsPath(true));
  if(res.status === 404){ ghSha = null; return {players:[], clubs:[], shortlists:[], games:[], shadowTeams:[], tacticalSheets:[]}; }
  if(res.status === 401) throw new Error('AUTH');
  if(res.status === 403) throw new Error('FORBIDDEN');
  if(!res.ok) throw new Error('HTTP_'+res.status);
  const data = await res.json();
  ghSha = data.sha;
  const json = b64ToUtf8(data.content);
  let parsed = null;
  try{ parsed = JSON.parse(json); }catch(e){ parsed = null; }
  const normGames = (arr) => (arr || []).map(g => ({playerIds: [], level: 'Equipa A', ...g}));
  // migração: versões antigas guardavam as notas por jogador dentro do próprio jogo (game.playerNotes);
  // agora vivem na ficha do jogador (player.notes), com uma referência gameId
  const migrateLegacyGameNotes = (playersArr, gamesArr) => {
    (gamesArr || []).forEach(g => {
      if(Array.isArray(g.playerNotes) && g.playerNotes.length){
        g.playerNotes.forEach(n => {
          const p = playersArr.find(x => x.id === n.playerId);
          if(p){
            if(!p.notes) p.notes = [];
            if(!p.notes.some(existing => existing.id === n.id)){
              p.notes.push({id: n.id, date: n.date, text: n.text, type: 'nota', gameId: g.id});
            }
          }
        });
      }
      delete g.playerNotes;
    });
  };
  // migração: os estados antigos dos jogadores (Em observação / A seguir / Recomendado / Dispensado)
  // deram lugar a um novo conjunto (Aprovado / Observação com Urgência / Acompanhar / Reprovado)
  const LEGACY_STATUS_MAP = {obs:'follow', follow:'follow', rec:'approved', out:'rejected'};
  const migrateStatuses = (playersArr) => {
    const validNow = STATUSES.map(s=>s.v);
    (playersArr || []).forEach(p => {
      if(!validNow.includes(p.status)){
        p.status = LEGACY_STATUS_MAP[p.status] || 'follow';
      }
      if(!p.statusChangedAt){
        p.statusChangedAt = p.createdAt || Date.now();
      }
    });
  };
  // migração: as posições antigas (Defesa Central única, Lateral Direito/Esquerdo, Avançado único)
  // deram lugar a um conjunto mais detalhado (DCD/DCE, DD/DE, Segundo Avançado/Ponta de Lança)
  const LEGACY_POSITION_MAP = {DC:'DCD', LD:'DD', LE:'DE', AV:'PL'};
  const migratePositions = (playersArr) => {
    const validNow = POSITIONS.map(p=>p.v);
    (playersArr || []).forEach(p => {
      if(p.position && !validNow.includes(p.position)){
        p.position = LEGACY_POSITION_MAP[p.position] || p.position;
      }
    });
  };
  if(Array.isArray(parsed)){
    migrateStatuses(parsed);
    migratePositions(parsed);
    return {players: parsed, clubs: [], shortlists: [], games: [], shadowTeams: [], tacticalSheets: []}; // formato antigo (só jogadores)
  }
  // normalização: shadow teams antigas não tinham categorização de jogadores (1ª Linha/2ª Linha/Composição)
  const normShadowTeams = (arr) => (arr || []).map(st => ({playerCategories: {}, ...st}));
  // normalização: clubes antigos não tinham "tipo" (clube vs seleção nacional)
  const normClubs = (arr) => (arr || []).map(c => ({type: 'clube', ...c}));
  // normalização: folhas táticas — cada equipa tem um mapa de posições {slotKey: {number, birthYear, notes}}
  // e uma lista de jogadores "por colocar" ainda não atribuídos a uma posição (vindos, por ex., de uma foto da ficha de equipa)
  const normTacticalSheets = (arr) => (arr || []).map(ts => ({
    ...ts,
    teams: (ts.teams || []).map(t => ({slots: {}, pending: [], ...t})),
  }));
  // migração: a nacionalidade era texto livre; se o texto corresponder ao nome de uma seleção já criada, liga-se automaticamente
  const migrateNationality = (playersArr, clubsArr) => {
    (playersArr || []).forEach(p => {
      if(!p.nationalTeamId && p.nationality){
        const match = (clubsArr || []).find(c => c.type==='selecao' && c.name.trim().toLowerCase() === p.nationality.trim().toLowerCase());
        if(match) p.nationalTeamId = match.id;
      }
    });
  };
  // migração: o nível de urgência de observação vivia num campo único (player.urgencyLevel); agora é derivado
  // do histórico de notas de tipo "nivel" (uma por jogo), para se ver o histórico completo na ficha do jogador
  const migrateUrgencyLevelToNotes = (playersArr) => {
    (playersArr || []).forEach(p => {
      if(p.urgencyLevel && !(p.notes||[]).some(n=>n.type==='nivel')){
        if(!p.notes) p.notes = [];
        p.notes.push({id: uid(), date: p.urgencyLevelChangedAt || p.createdAt || Date.now(), type:'nivel', level: p.urgencyLevel, gameId: null});
      }
    });
  };
  if(parsed && typeof parsed === 'object'){
    const outPlayers = parsed.players || [];
    const outClubs = normClubs(parsed.clubs);
    const outGames = normGames(parsed.games);
    migrateLegacyGameNotes(outPlayers, outGames);
    migrateStatuses(outPlayers);
    migratePositions(outPlayers);
    migrateNationality(outPlayers, outClubs);
    migrateUrgencyLevelToNotes(outPlayers);
    return {players: outPlayers, clubs: outClubs, shortlists: parsed.shortlists || [], games: outGames, shadowTeams: normShadowTeams(parsed.shadowTeams), tacticalSheets: normTacticalSheets(parsed.tacticalSheets)};
  }
  return {players:[], clubs:[], shortlists:[], games:[], shadowTeams:[], tacticalSheets:[]};
}

async function getRemoteSha(){
  const res = await ghRequest(contentsPath(true));
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('HTTP_'+res.status);
  const data = await res.json();
  return data.sha;
}

async function saveDataToGitHub(){
  const doPut = async () => {
    const body = {
      message: 'Atualizar base de dados de scouting',
      content: utf8ToB64(JSON.stringify({players, clubs, shortlists, games, shadowTeams, tacticalSheets}, null, 2)),
    };
    if(ghSha) body.sha = ghSha;
    return ghRequest(contentsPath(), {method:'PUT', body: JSON.stringify(body)});
  };
  let res = await doPut();
  if(res.status === 409){
    ghSha = await getRemoteSha();
    res = await doPut();
  }
  if(res.status === 401) throw new Error('AUTH');
  if(res.status === 403) throw new Error('FORBIDDEN');
  if(!res.ok) throw new Error('HTTP_'+res.status);
  const data = await res.json();
  ghSha = data.content.sha;
}

function mapGhError(e){
  const msg = (e && e.message) || '';
  if(msg === 'AUTH') return 'O token não é válido ou expirou. Vai a Definições e atualiza-o.';
  if(msg === 'FORBIDDEN') return 'Sem permissão de escrita neste repositório. Confirma o token em Definições.';
  if(msg === 'HTTP_404') return 'Repositório não encontrado. Confirma o nome em Definições.';
  return 'Não foi possível guardar no GitHub agora. Verifica a ligação e tenta novamente.';
}

async function saveData(){
  try{
    await saveDataToGitHub();
    storageOk = true;
  }catch(e){
    storageOk = false;
    showToast(mapGhError(e));
  }
}

  const root = document.getElementById('toastRoot');

  setTimeout(()=>{ root.innerHTML=''; }, 3200);
}

function homeContractsExpiringData(){
  const LIMIT_DAYS = 180;
  const list = players.filter(p=>p.contractUntil).map(p=>{
      const end = new Date(p.contractUntil+'T00:00:00');
      const diffDays = Math.ceil((end-Date.now())/(1000*60*60*24));
      return {p, diffDays};
    })
    .filter(x=>x.diffDays <= LIMIT_DAYS)
    .sort((a,b)=>a.diffDays-b.diffDays);
  const rows = list.length===0
    ? `<div class="insight-empty">Sem contratos a terminar em breve.</div>`
    : list.map(({p,diffDays})=>{
        const club = clubInfo(p.clubId);
        const months = Math.round(Math.abs(diffDays)/30);
        const expired = diffDays < 0;
        const tagCls = expired || diffDays<=90 ? 'danger' : 'warn';
        const tagLabel = expired ? 'Expirado' : `${months<=0?'<1':months} ${months===1?'mês':'meses'}`;
        return `
        <div class="insight-row">
          <div class="ii-main">
            <div class="ii-title">${escapeHtml(p.name)}</div>
            <div class="ii-sub">${club?escapeHtml(club.name):'Sem clube'} · termina ${fmtDateOnly(p.contractUntil)}</div>
          </div>
          <div class="insight-tag ${tagCls}">${tagLabel}</div>
        </div>`;
      }).join('');
  return {rows, count:list.length};
}
function homeRecentActivityData(){
  const items = [];
  players.forEach(p=>{
    (p.notes||[]).forEach(n=>{ items.push({p, n}); });
  });
  items.sort((a,b)=>b.n.date-a.n.date);
  const top = items.slice(0,6);
  const rows = top.length===0
    ? `<div class="insight-empty">Sem atividade recente.</div>`
    : top.map(({p,n})=>{
        const nt = noteTypeInfo(n.type);
        const label = nt.v==='final' ? 'Avaliação Final' : nt.v==='nivel' ? `Nível de Urgência: ${n.level||'—'}` : 'Nota adicionada';
        return `
        <div class="insight-row">
          <div class="ii-main">
            <div class="ii-title">${escapeHtml(p.name)}</div>
            <div class="ii-sub">${label} · ${timeAgo(n.date)}</div>
          </div>
        </div>`;
      }).join('');
  return {rows, count: top.length};
}
function homePlayersToReviewData(){
  const STALE_DAYS = 20;
  const list = players.filter(p=>p.status==='urgent' || p.status==='follow').map(p=>{
      const noteDates = (p.notes||[]).map(n=>n.date);
      const lastActivity = noteDates.length ? Math.max(...noteDates) : (p.statusChangedAt || p.createdAt || 0);
      const days = Math.floor((Date.now()-lastActivity)/(1000*60*60*24));
      return {p, days};
    })
    .filter(x=>x.days >= STALE_DAYS)
    .sort((a,b)=>b.days-a.days);
  const rows = list.length===0
    ? `<div class="insight-empty">Nenhum jogador esquecido.</div>`
    : list.map(({p,days})=>{
        const st = statusInfo(p.status);
        return `
        <div class="insight-row">
          <div class="ii-main">
            <div class="ii-title">${escapeHtml(p.name)}</div>
            <div class="ii-sub">${st.label} · sem nota há ${days} dias</div>
          </div>
          <div class="insight-tag warn">Rever</div>
        </div>`;
      }).join('');
  return {rows, count:list.length};
}

async function submitSetup(){

  if(!owner || !repo || !token){

  ghConfig = {owner, repo, token};
  renderLoadingScreen('A ligar ao GitHub...');
  try{
    const data = await fetchDataFromGitHub();
    players = data.players; clubs = data.clubs; shortlists = data.shortlists; games = data.games; shadowTeams = data.shadowTeams; tacticalSheets = data.tacticalSheets;

    saveConfig(ghConfig);
    storageOk = true;
    renderMainShell();
  }catch(e){
    renderSetupScreen(mapGhError(e));
  }
}

/* ---------------- rendering: list ---------------- */
function getFiltered(){
  let list = players.filter(p=>{
    const club = clubInfo(p.clubId);
    const clubName = club ? club.name.toLowerCase() : '';
    if(state.search && !(p.name.toLowerCase().includes(state.search) || clubName.includes(state.search))) return false;
    if(state.line && posInfo(p.position).line !== state.line) return false;
    if(state.status !== 'all' && p.status !== state.status) return false;
    if(state.clubId && p.clubId !== state.clubId) return false;
    if(p.rating < state.minRating) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(state.sort==='rating') return b.rating - a.rating;
    if(state.sort==='name') return a.name.localeCompare(b.name);
    if(state.sort==='age') return (calcAge(a.birthDate)||0) - (calcAge(b.birthDate)||0);
    if(state.sort==='recent') return b.createdAt - a.createdAt;
    return 0;
  });
  return list;
}

function starsHtml(rating, size){
  size = size || 14;
  let out = '<div class="stars">';
  for(let i=1;i<=5;i++){
    out += `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${i<=rating?'var(--gold)':'none'}" stroke="var(--gold-dim)" stroke-width="1.4"><polygon points="12 2 15 9 22 9.5 16.5 14.5 18 22 12 18 6 22 7.5 14.5 2 9.5 9 9"/></svg>`;
  }
  return out+'</div>';
}

  document.getElementById('countLabel').textContent = `${list.length} jogador${list.length===1?'':'es'}`;

  if(players.length === 0){
    container.innerHTML = `
      <div class="empty">
        <h2>Ainda não tens jogadores</h2>
        <p>Adiciona o primeiro jogador que observaste para começar a construir a tua base de dados.</p>
        <button class="btn btn-primary" onclick="openAddModal()">+ Novo Jogador</button>
      </div>`;
    return;
  }
  if(list.length === 0){
    container.innerHTML = `<div class="empty"><h2>Nenhum resultado</h2><p>Ajusta os filtros ou a pesquisa.</p></div>`;
    return;
  }

  container.innerHTML = `<div class="list">
    ${list.map(p=>{
      const pos = posInfo(p.position);
      const st = statusInfo(p.status);
      const club = clubInfo(p.clubId);
      const age = calcAge(p.birthDate);
      return `
      <button class="row" onclick="openDossier('${p.id}')">
        ${avatarHtml(p.photo, initials(p.name), pos.line)}
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="club">${club && club.logo ? `<img src="${club.logo}" class="club-logo-mini" alt="">` : ''}<span>${club ? escapeHtml(club.name) : '—'}</span></div>
        <div class="pos-tag">${pos.v}</div>
        <div class="age num">${p.birthDate ? `${fmtDateOnly(p.birthDate)}${age!==null?` (${age} anos)`:''}` : '—'}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          ${starsHtml(p.rating)}
          <span class="status-pill ${st.cls}">${st.label}</span>
        </div>
      </button>`;
    }).join('')}
  </div>`;
}

  }
  const p = {

    ...fields,

    rating: 0,

async function submitClubForm(editId){
  const name = document.getElementById('c_name').value.trim();
  if(!name){ showToast('Indica o nome do clube.'); return; }
  const typeEl = document.querySelector('input[name="c_type"]:checked');
  const type = typeEl ? typeEl.value : 'clube';
  const fileInput = document.getElementById('c_logo');
  const file = fileInput.files[0];
  const removeChk = document.getElementById('c_logo_remove');
  if(editId){
    const c = clubs.find(x=>x.id===editId);
    if(!c){ closeModal(); return; }
    if(file){
      try{ c.logo = await fileToDataUrl(file, 240, 0.85); }
      catch(e){ showToast('Não foi possível carregar o logótipo.'); }
    } else if(removeChk && removeChk.checked){
      c.logo = null;
    }
    c.name = name;
    c.type = type;
  } else {
    let logo = null;
    if(file){
      try{ logo = await fileToDataUrl(file, 240, 0.85); }
      catch(e){ showToast('Não foi possível carregar o logótipo.'); }
    }
    clubs.push({id: uid(), name, logo, type, createdAt: Date.now()});
  }
  await saveData();
  closeModal();
  render();
}

async function seedNationalTeams(){
  const existing = new Set(clubs.map(c=>c.name.trim().toLowerCase()));
  const missing = NATIONAL_TEAM_SEEDS.filter(name => !existing.has(name.toLowerCase()));
  if(missing.length === 0){ showToast('Já tens todas as seleções principais criadas.'); return; }
  if(!confirm(`Adicionar ${missing.length} seleções nacionais (Europa, América do Sul e África)?`)) return;
  missing.forEach(name => clubs.push({id: uid(), name, logo: null, type: 'selecao', createdAt: Date.now()}));
  await saveData();
  render();
  showToast(`${missing.length} seleções adicionadas.`);
}

async function seedTopDivisionClubs(){
  const existing = new Set(clubs.map(c=>c.name.trim().toLowerCase()));
  const missing = CLUB_SEEDS.filter(name => !existing.has(name.toLowerCase()));
  if(missing.length === 0){ showToast('Já tens todos estes clubes criados.'); return; }
  if(!confirm(`Adicionar ${missing.length} clubes (1ªs divisões de Espanha, Bélgica, Brasil, Argentina, Suécia, Dinamarca, França e Croácia)?`)) return;
  missing.forEach(name => clubs.push({id: uid(), name, logo: null, type: 'clube', createdAt: Date.now()}));
  await saveData();
  render();
  showToast(`${missing.length} clubes adicionados.`);
}

async function removeClub(id){
  const c = clubs.find(x=>x.id===id);
  if(!c) return;
  const isNatl = c.type === 'selecao';
  const count = players.filter(p=>p.clubId===id).length;
  const msg = isNatl
    ? `Eliminar a seleção "${c.name}"? Os jogos já registados mantêm-se, mas ficam sem esta seleção associada.`
    : count > 0
      ? `Eliminar "${c.name}"? ${count} jogador${count===1?'':'es'} ficará${count===1?'':'ão'} sem clube atribuído.`
      : `Eliminar o clube "${c.name}"?`;
  if(!confirm(msg)) return;
  clubs = clubs.filter(x=>x.id!==id);
  players.forEach(p=>{ if(p.clubId===id) p.clubId=null; });
  if(activeClubId === id) activeClubId = null;
  await saveData();
  render();
}

  const selA = document.getElementById('g_clubA');
  const selB = document.getElementById('g_clubB');
  if(selA) selA.innerHTML = gameFormTeamOptionsHtml(type, list[0] && list[0].id);
  if(selB) selB.innerHTML = gameFormTeamOptionsHtml(type, list[1] && list[1].id);
}
function openGameFormModal(editId){
  const realClubs = gameFormTeamsOfType('clube');
  const natlTeams = gameFormTeamsOfType('selecao');
  if(realClubs.length < 2 && natlTeams.length < 2){
    showToast('Precisas de ter pelo menos duas equipas do mesmo tipo (clubes ou seleções) para registares um jogo.');
    return;
  }
  const editing = editId ? games.find(g=>g.id===editId) : null;
  const editingType = editing ? ((clubInfo(editing.clubAId)||{}).type === 'selecao' ? 'selecao' : 'clube') : null;
  const currentType = editingType || (realClubs.length >= 2 ? 'clube' : 'selecao');
  const currentList = gameFormTeamsOfType(currentType);
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${editing ? 'Editar Jogo' : 'Novo Jogo'}</h2>
        <div class="field">
          <label>Tipo de jogo</label>
          <div class="type-toggle">
            <label style="${realClubs.length<2?'opacity:.4;':''}"><input type="radio" name="g_type" value="clube" ${currentType==='clube'?'checked':''} ${realClubs.length<2?'disabled':''} onchange="onGameTypeChange('clube')"><span>⚽ Clubes</span></label>
            <label style="${natlTeams.length<2?'opacity:.4;':''}"><input type="radio" name="g_type" value="selecao" ${currentType==='selecao'?'checked':''} ${natlTeams.length<2?'disabled':''} onchange="onGameTypeChange('selecao')"><span>🏳️ Seleções</span></label>
          </div>
          ${realClubs.length<2 ? `<div class="field-hint">Precisas de pelo menos dois clubes criados para escolher esta opção.</div>` : ''}
          ${natlTeams.length<2 ? `<div class="field-hint">Precisas de pelo menos duas seleções criadas para escolher esta opção.</div>` : ''}
        </div>
        <div class="field-row">
          <div class="field">
            <label>Equipa 1</label>
            <select id="g_clubA">${gameFormTeamOptionsHtml(currentType, editing?editing.clubAId:(currentList[0]&&currentList[0].id))}</select>
          </div>
          <div class="field">
            <label>Equipa 2</label>
            <select id="g_clubB">${gameFormTeamOptionsHtml(currentType, editing?editing.clubBId:(currentList[1]&&currentList[1].id))}</select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Competição</label><input id="g_competition" type="text" placeholder="ex: Liga Portugal" value="${editing?escapeHtml(editing.competition||''):''}"></div>
          <div class="field">
            <label>Escalão</label>
            <select id="g_level">${GAME_LEVELS.map(l=>`<option value="${l}" ${(editing?(editing.level||'Equipa A'):'Equipa A')===l?'selected':''}>${l}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>Data</label><input id="g_date" type="date" value="${editing&&editing.date?editing.date:''}"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="submitGameForm(${editing?`'${editing.id}'`:'null'})">${editing ? 'Guardar' : 'Criar jogo'}</button>
        </div>
      </div>
    </div>`;
}

async function submitGameForm(editId){
  const clubAId = document.getElementById('g_clubA').value;
  const clubBId = document.getElementById('g_clubB').value;
  const competition = document.getElementById('g_competition').value.trim();
  const level = document.getElementById('g_level').value;
  const date = document.getElementById('g_date').value;
  if(!clubAId || !clubBId){ showToast('Seleciona as duas equipas.'); return; }
  if(clubAId === clubBId){ showToast('As duas equipas têm de ser diferentes.'); return; }
  if(!competition){ showToast('Indica a competição.'); return; }
  if(!date){ showToast('Indica a data do jogo.'); return; }
  if(editId){
    const g = games.find(x=>x.id===editId);
    if(!g){ closeModal(); return; }
    g.clubAId = clubAId; g.clubBId = clubBId; g.competition = competition; g.date = date; g.level = level;
    if(!g.playerIds) g.playerIds = [];
    // se a equipa mudou, só mantém jogadores que continuam elegíveis (por clube ou por nacionalidade, consoante o tipo)
    const eligible = eligiblePlayersForTeams(clubAId, clubBId);
    g.playerIds = g.playerIds.filter(pid => eligible.some(p=>p.id===pid));
  } else {
    games.push({id: uid(), clubAId, clubBId, competition, date, level, playerIds: [], createdAt: Date.now()});
  }
  await saveData();
  closeModal();
  render();
}

async function removeGame(id){
  const g = games.find(x=>x.id===id);
  if(!g) return;
  if(!confirm('Eliminar este jogo?')) return;
  games = games.filter(x=>x.id!==id);
  if(activeGameId === id) activeGameId = null;
  await saveData();
  render();
}

function openGameDetail(id){
  activeGameId = id;

}

async function toggleGamePlayer(gameId, playerId){
  const g = games.find(x=>x.id===gameId);
  if(!g) return;
  if(!g.playerIds) g.playerIds = [];
  const idx = g.playerIds.indexOf(playerId);
  if(idx === -1) g.playerIds.push(playerId); else g.playerIds.splice(idx,1);
  await saveData();
}

async function addGamePlayerNote(gameId, playerId){
  const ta = document.getElementById('gpn_'+playerId);
  const text = ta.value.trim();
  if(!text) return;
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  if(!p.notes) p.notes = [];
  // as notas criadas a partir de um jogo ficam guardadas na ficha do jogador (tipo "Nota"), com referência ao jogo
  p.notes.push({id: uid(), date: Date.now(), text, type: 'nota', gameId});
  delete gameNoteDrafts[gameId+'_'+playerId];
  await saveData();
  renderTabContent();
}

async function removeGamePlayerNote(playerId, noteId){
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  p.notes = (p.notes || []).filter(n=>n.id!==noteId);
  await saveData();
  renderTabContent();
}

async function toggleShortlistPlayer(shortlistId, playerId){
  const sl = shortlists.find(s=>s.id===shortlistId);
  if(!sl) return;

  if(idx === -1) sl.playerIds.push(playerId); else sl.playerIds.splice(idx,1);

function openShortlistFormModal(editId, addPlayerId){
  const editing = editId ? shortlists.find(s=>s.id===editId) : null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${editing ? 'Editar Shortlist' : 'Nova Shortlist'}</h2>
        <div class="field"><label>Nome</label><input id="sl_name" type="text" placeholder="ex: Alvos Janeiro" value="${editing?escapeHtml(editing.name):''}"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="submitShortlistForm(${editing?`'${editing.id}'`:'null'}, ${addPlayerId?`'${addPlayerId}'`:'null'})">${editing?'Guardar':'Criar shortlist'}</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{ const el=document.getElementById('sl_name'); if(el) el.focus(); }, 50);
}

async function submitShortlistForm(editId, addPlayerId){
  const name = document.getElementById('sl_name').value.trim();
  if(!name){ showToast('Indica o nome da shortlist.'); return; }
  if(editId){
    const sl = shortlists.find(s=>s.id===editId);
    if(sl) sl.name = name;
  } else {
    shortlists.push({id: uid(), name, playerIds: addPlayerId ? [addPlayerId] : [], createdAt: Date.now()});
  }
  await saveData();
  closeModal();
  if(addPlayerId){ renderDossier(); } else { render(); }
}

async function removeShortlist(id){
  const sl = shortlists.find(s=>s.id===id);
  if(!sl) return;
  if(!confirm(`Eliminar a shortlist "${sl.name}"? Os jogadores não são apagados, só deixam de estar nesta lista.`)) return;
  shortlists = shortlists.filter(s=>s.id!==id);
  if(activeShortlistId === id) activeShortlistId = null;
  await saveData();
  render();
}

function renderShadowTeamDetailHtml(st){
  const headHtml = `
    <div class="shortlist-detail-head">
      <button class="btn btn-ghost" onclick="activeShadowTeamId=null; renderTabContent();">← Shadow Teams</button>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost" onclick="openShadowTeamFormModal('${st.id}')">Editar nome</button>
        <button class="btn btn-ghost" onclick="removeShadowTeam('${st.id}')">Eliminar</button>
      </div>
    </div>
    <h2 class="shortlist-detail-title">${escapeHtml(st.name)}</h2>
  `;
  // agrupar jogadores pela posição exata da ficha, mantendo a ordem de st.playerIds (define o ranking dentro de cada posição)
  const byPos = {};
  POSITIONS.forEach(pos=>{ byPos[pos.v] = []; });
  st.playerIds.forEach(pid=>{
    const p = players.find(x=>x.id===pid);
    if(!p) return;
    if(!byPos[p.position]) byPos[p.position] = [];
    byPos[p.position].push(p);
  });
  const slotHtml = (posCode, cssClass) => {
    const list = byPos[posCode] || [];
    const body = list.length === 0
      ? `<div class="pitch-slot-empty">Sem jogadores</div>`
      : list.map((p,i)=>pitchPlayerRowHtml(st, p, i+1, i===0, i===list.length-1)).join('');
    return `
      <div class="pitch-slot ${cssClass}">
        <div class="pitch-slot-head"><span class="pitch-slot-pos">${posCode}</span><span class="pitch-slot-count">${list.length}</span></div>
        ${body}
      </div>`;
  };
  const addPlayerHtml = `
    <div class="st-add-player">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="stAddInput" placeholder="Procurar jogador para adicionar..." value="${escapeHtml(shadowAddSearch)}" oninput="onShadowAddSearch('${st.id}', this.value)">
      <div class="st-add-dropdown" id="stAddDropdown"></div>
    </div>
  `;
  return headHtml + addPlayerHtml + `
    <div class="pitch-wrap">

function renderShadowAddDropdown(shadowTeamId){
  const el = document.getElementById('stAddDropdown');
  if(!el) return;
  const st = shadowTeams.find(s=>s.id===shadowTeamId);
  const q = shadowAddSearch.trim().toLowerCase();
  if(!st || !q){ el.innerHTML=''; el.style.display='none'; return; }
  const matches = players.filter(p=>{
    if(st.playerIds.includes(p.id)) return false;
    const clubName = (clubInfo(p.clubId)||{}).name || '';
    return p.name.toLowerCase().includes(q) || clubName.toLowerCase().includes(q);
  }).slice(0,8);
  if(matches.length === 0){
    el.innerHTML = `<div class="stad-empty">Sem resultados para "${escapeHtml(shadowAddSearch.trim())}".</div>`;
    el.style.display='block';
    return;
  }
  el.innerHTML = matches.map(p=>{
    const club = clubInfo(p.clubId);
    return `
    <div class="stad-item" onclick="addPlayerToShadowTeamViaSearch('${st.id}','${p.id}')">
      <div class="stad-badge">${club && club.logo ? `<img src="${club.logo}" alt="">` : escapeHtml(initials(p.name))}</div>
      <div><div class="stad-name">${escapeHtml(p.name)}</div><div class="stad-sub">${club?escapeHtml(club.name):'Sem clube'}</div></div>
      <span class="stad-pos-tag">${escapeHtml(p.position)}</span>
    </div>`;
  }).join('');
  el.style.display='block';
}

async function addPlayerToShadowTeamViaSearch(shadowTeamId, playerId){
  await toggleShadowTeamPlayer(shadowTeamId, playerId);
  shadowAddSearch = '';
  renderTabContent();
}

async function toggleShadowTeamPlayer(shadowTeamId, playerId){
  const st = shadowTeams.find(s=>s.id===shadowTeamId);
  if(!st) return;
  const idx = st.playerIds.indexOf(playerId);
  if(idx === -1) st.playerIds.push(playerId); else st.playerIds.splice(idx,1);
  if(st.playerCategories) delete st.playerCategories[playerId];
  await saveData();
}

async function setShadowPlayerCategory(shadowTeamId, playerId, cat){
  const st = shadowTeams.find(s=>s.id===shadowTeamId);
  if(!st) return;
  if(!st.playerCategories) st.playerCategories = {};
  if(cat){ st.playerCategories[playerId] = cat; } else { delete st.playerCategories[playerId]; }
  await saveData();
  renderTabContent();
}

async function moveShadowPlayerRank(shadowTeamId, playerId, direction){
  const st = shadowTeams.find(s=>s.id===shadowTeamId);
  if(!st) return;
  const p = players.find(x=>x.id===playerId);
  if(!p) return;
  // ranking é relativo apenas aos outros jogadores na mesma posição exata
  const samePos = st.playerIds.filter(id=>{
    const pp = players.find(x=>x.id===id);
    return pp && pp.position === p.position;
  });
  const posIdx = samePos.indexOf(playerId);
  const swapWith = samePos[posIdx + direction];
  if(swapWith === undefined) return;
  const iA = st.playerIds.indexOf(playerId);
  const iB = st.playerIds.indexOf(swapWith);
  [st.playerIds[iA], st.playerIds[iB]] = [st.playerIds[iB], st.playerIds[iA]];
  await saveData();
  renderTabContent();
}
