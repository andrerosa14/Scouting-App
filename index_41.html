async function submitTacticalSheetForm(){
  captureTacticalFormDraft();
  const name = tacticalFormDraft.name.trim();
  if(!name){ showToast('Indica o nome da folha tática.'); return; }
  if(tacticalFormDraft.teams.some(t=>!t.name.trim())){ showToast('Indica o nome de cada equipa.'); return; }
  const editing = tacticalFormEditId ? tacticalSheets.find(x=>x.id===tacticalFormEditId) : null;
  if(editing){
    if(tacticalFormDraft.teams.length < editing.teams.length){
      const removedTeam = editing.teams[editing.teams.length-1];
      const hasFilled = Object.values(removedTeam.slots||{}).some(s=>s && ((s.number&&s.number.trim())||(s.birthYear&&s.birthYear.trim())||(s.notes&&s.notes.trim())));
      const hasPending = (removedTeam.pending||[]).length > 0;
      if((hasFilled || hasPending) && !confirm(`Remover a equipa "${removedTeam.name}" apaga os números, anos, notas e a lista "por colocar" já preenchidos nessa equipa. Continuar?`)) return;
    }
    editing.name = name;
    editing.teams = tacticalFormDraft.teams.map((t, idx) => {
      const existing = editing.teams[idx];
      return { name: t.name.trim(), formation: t.formation, slots: (existing && existing.slots) || {}, pending: (existing && existing.pending) || [] };
    });
    editing.updatedAt = Date.now();
  } else {
    tacticalSheets.push({
      id: uid(), name, createdAt: Date.now(), updatedAt: Date.now(),
      teams: tacticalFormDraft.teams.map(t=>({name:t.name.trim(), formation:t.formation, slots:{}, pending:[]})),
    });
  }
  await saveData();
  closeModal();
  tacticalFormEditId = null;
  tacticalFormDraft = null;
  render();
}

async function removeTacticalSheet(id){
  const ts = tacticalSheets.find(x=>x.id===id);
  if(!ts) return;
  if(!confirm(`Eliminar a folha tática "${ts.name}"? Esta ação não pode ser desfeita.`)) return;
  tacticalSheets = tacticalSheets.filter(x=>x.id!==id);
  if(activeTacticalSheetId === id) activeTacticalSheetId = null;
  if(tacticalSelectedPending && tacticalSelectedPending.sheetId === id) tacticalSelectedPending = null;
  const prefix = id+'_';
  Object.keys(tacticalNoteDrafts).forEach(k=>{ if(k.startsWith(prefix)) delete tacticalNoteDrafts[k]; });
  Array.from(tacticalNoteOpen).forEach(k=>{ if(k.startsWith(prefix)) tacticalNoteOpen.delete(k); });
  await saveData();
  renderMainShell();
}

/* ---- ecrã de detalhe: campo(s) com posições, números e anos de nascimento ---- */
function slotDomId(sheetId, teamIdx, slotKey){ return `tsslot_${sheetId}_${teamIdx}_${slotKey}`; }

function getOrCreateTacticalSlot(sheet, teamIdx, slotKey){
  const team = sheet.teams[teamIdx];
  if(!team.slots) team.slots = {};
  if(!team.slots[slotKey]) team.slots[slotKey] = {number:'', birthYear:'', notes:'', highlight:false};
  return team.slots[slotKey];
}

// ano de nascimento mais alto (jogador mais novo) desta equipa, calculado de forma independente por equipa/campo
function tacticalTeamMaxYear(team){
  const formation = TACTICAL_FORMATIONS[team.formation];
  if(!formation) return null;
  let maxYear = null;
  formation.slots.forEach(slotDef=>{
    const slot = (team.slots||{})[slotDef.key];
    const raw = slot && slot.birthYear ? slot.birthYear.trim() : '';
    const y = raw ? parseInt(raw, 10) : NaN;
    if(!isNaN(y) && (maxYear === null || y > maxYear)) maxYear = y;
  });
  return maxYear;
}

function tacticalSlotHtml(sheet, teamIdx, slotDef, maxYear){
  const team = sheet.teams[teamIdx];
  const slot = (team.slots||{})[slotDef.key] || {number:'', birthYear:'', notes:'', highlight:false};
  const number = slot.number || '';
  const birthYear = slot.birthYear || '';
  const numTrim = number.trim();
  const yearTrim = birthYear.trim();
  const isFilled = !!(numTrim || yearTrim);
  const yNum = yearTrim ? parseInt(yearTrim, 10) : NaN;
  const isAutoOldest = maxYear !== null && !isNaN(yNum) && yNum === maxYear;
  const isManualHighlight = !!slot.highlight;
  const isHighlighted = isAutoOldest || isManualHighlight;
  const noteKey = `${sheet.id}_${teamIdx}_${slotDef.key}`;
  const noteOpen = tacticalNoteOpen.has(noteKey);
  const draftNotes = (noteKey in tacticalNoteDrafts) ? tacticalNoteDrafts[noteKey] : (slot.notes || '');
  const hasNotes = !!(slot.notes && slot.notes.trim());
  // modo de colocação: se há um jogador selecionado na lista "por colocar" desta equipa, as posições vazias ficam clicáveis
  const isPlaceable = !isFilled && tacticalSelectedPending && tacticalSelectedPending.sheetId===sheet.id && tacticalSelectedPending.teamIdx===teamIdx;
  return `
    <div class="ts-slot ${isFilled?'filled':''} ${isHighlighted?'oldest':''} ${isPlaceable?'placeable':''}" id="${slotDomId(sheet.id, teamIdx, slotDef.key)}" style="left:${slotDef.x}%;top:${slotDef.y}%;" onclick="tacticalSlotClick('${sheet.id}',${teamIdx},'${slotDef.key}')">
      <div class="ts-slot-badge">${numTrim ? escapeHtml(numTrim) : '–'}</div>
      <div class="ts-slot-pos">${slotDef.label}</div>
      ${yearTrim ? `<div class="ts-slot-year">${escapeHtml(yearTrim)}</div>` : ''}
      <div class="ts-slot-inputs">
        <input type="text" placeholder="Nº" value="${escapeHtml(number)}" oninput="tacticalSlotUpdateNumber('${sheet.id}',${teamIdx},'${slotDef.key}',this.value)" onblur="saveData()">
        <input type="text" class="ts-year-input" placeholder="Ano" value="${escapeHtml(birthYear)}" oninput="tacticalSlotUpdateYear('${sheet.id}',${teamIdx},'${slotDef.key}',this.value)" onblur="saveData()">
      </div>
      <div class="ts-slot-actions">
        <button type="button" class="ts-slot-note-btn ${hasNotes?'ts-slot-note-has':''}" onclick="event.stopPropagation(); toggleTacticalNote('${sheet.id}',${teamIdx},'${slotDef.key}')">${hasNotes?'notas ✓':'+ nota'}</button>
        <button type="button" class="ts-slot-star-btn ${isManualHighlight?'active':''}" title="Destacar manualmente a amarelo" onclick="event.stopPropagation(); toggleTacticalManualHighlight('${sheet.id}',${teamIdx},'${slotDef.key}')">${isManualHighlight?'★':'☆'}</button>
      </div>
      ${noteOpen ? `<div class="ts-slot-note-box" onclick="event.stopPropagation()"><textarea placeholder="Notas sobre este jogador..." oninput="tacticalNoteDrafts['${noteKey}']=this.value" onblur="tacticalSlotCommitNotes('${sheet.id}',${teamIdx},'${slotDef.key}')">${escapeHtml(draftNotes)}</textarea></div>` : ''}
    </div>`;
}

async function toggleTacticalManualHighlight(sheetId, teamIdx, slotKey){
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const slot = getOrCreateTacticalSlot(sheet, teamIdx, slotKey);
  slot.highlight = !slot.highlight;
  await saveData();
  renderTabContent();
}

async function parseTacticalPendingList(sheetId, teamIdx){
  const ta = document.getElementById(`tsPendingPaste_${sheetId}_${teamIdx}`);
  if(!ta) return;
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const team = sheet.teams[teamIdx];
  if(!team) return;
  if(!team.pending) team.pending = [];
  let added = 0;
  lines.forEach(line=>{
    // aceita formatos como "22 2007", "22-2007", "22, 2007", "22 · 2007"
    const m = line.match(/(\d+)\D+(\d{4})/);
    if(m){
      team.pending.push({id: uid(), number: m[1], birthYear: m[2]});
      added++;
    }
  });
  if(added === 0){ showToast('Não consegui reconhecer nenhuma linha. Usa o formato "número ano", um jogador por linha.'); return; }
  await saveData();
  renderTabContent();
}

function selectTacticalPending(sheetId, teamIdx, pendingId){
  if(tacticalSelectedPending && tacticalSelectedPending.sheetId===sheetId && tacticalSelectedPending.teamIdx===teamIdx && tacticalSelectedPending.pendingId===pendingId){
    tacticalSelectedPending = null;
  } else {
    tacticalSelectedPending = {sheetId, teamIdx, pendingId};
  }
  renderTabContent();
}

async function removeTacticalPendingChip(sheetId, teamIdx, pendingId){
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const team = sheet.teams[teamIdx];
  if(!team) return;
  team.pending = (team.pending||[]).filter(p=>p.id!==pendingId);
  if(tacticalSelectedPending && tacticalSelectedPending.sheetId===sheetId && tacticalSelectedPending.teamIdx===teamIdx && tacticalSelectedPending.pendingId===pendingId){
    tacticalSelectedPending = null;
  }
  await saveData();
  renderTabContent();
}

// clique numa posição do campo: se houver um jogador selecionado na lista "por colocar" desta equipa e a posição estiver vazia, coloca-o lá
async function tacticalSlotClick(sheetId, teamIdx, slotKey){
  const sel = tacticalSelectedPending;
  if(!sel || sel.sheetId !== sheetId || sel.teamIdx !== teamIdx) return;
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const team = sheet.teams[teamIdx];
  if(!team) return;
  const existing = (team.slots||{})[slotKey];
  const isFilled = existing && (((existing.number||'').trim()) || ((existing.birthYear||'').trim()));
  if(isFilled) return;
  const pendingItem = (team.pending||[]).find(p=>p.id===sel.pendingId);
  if(!pendingItem){ tacticalSelectedPending = null; renderTabContent(); return; }
  const slot = getOrCreateTacticalSlot(sheet, teamIdx, slotKey);
  slot.number = pendingItem.number;
  slot.birthYear = pendingItem.birthYear;
  team.pending = (team.pending||[]).filter(p=>p.id!==sel.pendingId);
  tacticalSelectedPending = null;
  await saveData();
  renderTabContent();
}

/* ---- interação com as posições (evita re-render completo para não perder o foco a meio da escrita) ---- */
function tacticalSlotUpdateNumber(sheetId, teamIdx, slotKey, value){
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const slot = getOrCreateTacticalSlot(sheet, teamIdx, slotKey);
  slot.number = value;
  const slotEl = document.getElementById(slotDomId(sheetId, teamIdx, slotKey));
  if(slotEl){
    const badge = slotEl.querySelector('.ts-slot-badge');
    const trimmed = value.trim();
    if(badge) badge.textContent = trimmed ? trimmed : '–';
    slotEl.classList.toggle('filled', !!(trimmed || (slot.birthYear && slot.birthYear.trim())));
  }
}

function tacticalSlotUpdateYear(sheetId, teamIdx, slotKey, value){
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const slot = getOrCreateTacticalSlot(sheet, teamIdx, slotKey);
  slot.birthYear = value;
  const slotEl = document.getElementById(slotDomId(sheetId, teamIdx, slotKey));
  if(slotEl){
    const trimmed = value.trim();
    slotEl.classList.toggle('filled', !!(trimmed || (slot.number && slot.number.trim())));
    let pill = slotEl.querySelector('.ts-slot-year');
    if(trimmed){
      if(!pill){
        pill = document.createElement('div');
        pill.className = 'ts-slot-year';
        const posEl = slotEl.querySelector('.ts-slot-pos');
        if(posEl) posEl.insertAdjacentElement('afterend', pill);
      }
      pill.textContent = trimmed;
    } else if(pill){
      pill.remove();
    }
  }
  refreshTacticalOldestHighlight(sheetId, teamIdx);
}

function refreshTacticalOldestHighlight(sheetId, teamIdx){
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(!sheet) return;
  const team = sheet.teams[teamIdx];
  if(!team) return;
  const formation = TACTICAL_FORMATIONS[team.formation];
  if(!formation) return;
  const maxYear = tacticalTeamMaxYear(team);
  formation.slots.forEach(slotDef=>{
    const slot = (team.slots||{})[slotDef.key];
    const raw = slot && slot.birthYear ? slot.birthYear.trim() : '';
    const y = raw ? parseInt(raw, 10) : NaN;
    const isAutoOldest = maxYear !== null && !isNaN(y) && y === maxYear;
    const isHighlighted = isAutoOldest || !!(slot && slot.highlight);
    const slotEl = document.getElementById(slotDomId(sheetId, teamIdx, slotDef.key));
    if(slotEl) slotEl.classList.toggle('oldest', isHighlighted);
  });
}

function toggleTacticalNote(sheetId, teamIdx, slotKey){
  const key = `${sheetId}_${teamIdx}_${slotKey}`;
  if(tacticalNoteOpen.has(key)) tacticalNoteOpen.delete(key); else tacticalNoteOpen.add(key);
  renderTabContent();
}

async function tacticalSlotCommitNotes(sheetId, teamIdx, slotKey){
  const key = `${sheetId}_${teamIdx}_${slotKey}`;
  if(!(key in tacticalNoteDrafts)) return;
  const sheet = tacticalSheets.find(s=>s.id===sheetId);
  if(sheet){
    const slot = getOrCreateTacticalSlot(sheet, teamIdx, slotKey);
    slot.notes = tacticalNoteDrafts[key];
  }
  delete tacticalNoteDrafts[key];
  const btn = document.querySelector(`#${slotDomId(sheetId, teamIdx, slotKey)} .ts-slot-note-btn`);
  if(btn){
    const has = sheet && sheet.teams[teamIdx].slots[slotKey] && sheet.teams[teamIdx].slots[slotKey].notes.trim();
    btn.textContent = has ? 'notas ✓' : '+ nota';
    btn.classList.toggle('ts-slot-note-has', !!has);
  }
  await saveData();
}

      <h3>Dados básicos</h3>
      <dl class="report-grid">
        <div><dt>Data de nascimento</dt><dd>${p.birthDate ? fmtDateOnly(p.birthDate) : '—'}</dd></div>
        <div><dt>Nacionalidade</dt><dd>${escapeHtml(nationalityLabel)}</dd></div>
        <div><dt>Altura</dt><dd>${p.height ? p.height+' cm' : '—'}</dd></div>
        <div><dt>Pé preferido</dt><dd>${escapeHtml(p.foot || '—')}</dd></div>
        <div><dt>Contrato até</dt><dd>${p.contractUntil ? fmtDateOnly(p.contractUntil) : '—'}${cStatus ? ' · '+escapeHtml(cStatus.label) : ''}</dd></div>
        <div><dt>Rating geral</dt><dd>${starsHtml} <span style="font-size:12px;color:var(--ink-muted);">${p.rating||0}/5</span></dd></div>
      </dl>
    </div>

    <div class="report-section">
      <h3>Notas e Avaliações (${p.notes.length})</h3>
      ${notesHtml}
    </div>

    <div class="report-footer">
      <span>Relatório confidencial — uso interno de scouting</span>
      <span>Scouting Base</span>
    </div>
  </div>
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 200); };<\/script>
</body>
</html>`;
}

function exportPlayerReport(id){
  const p = players.find(x=>x.id===id);
  if(!p) return;
  const html = playerReportHtml(p);
  const win = window.open('', '_blank');
  if(!win){ showToast('O browser bloqueou a nova janela. Permite pop-ups para exportar o relatório.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

/* ---------------- mutations ---------------- */
async function updateStatus(id, v){
  const p = players.find(x=>x.id===id);
  if(p.status !== v) p.statusChangedAt = Date.now();
  p.status=v;
  await saveData();
  render();
}
async function updateUrgencyLevel(id, v, gameId){
  const p = players.find(x=>x.id===id);
  if(!p) return;
  if(!p.notes) p.notes = [];
  // um jogo só tem uma nota de nível por jogador — voltar a escolher outro nível no mesmo relatório atualiza-a em vez de duplicar
  let note = p.notes.find(n => n.type==='nivel' && n.gameId === (gameId || null));
  if(note){
    note.level = v;
    note.date = Date.now();
  } else {
    p.notes.push({id: uid(), date: Date.now(), type:'nivel', level: v, gameId: gameId || null});
  }
  await saveData();
  render();
}
async function updateRating(id, v){
  const p = players.find(x=>x.id===id); p.rating = (p.rating===v ? 0 : v); await saveData(); render();
}
async function addNote(id){
  const ta = document.getElementById('noteText');
  const text = ta.value.trim();
  if(!text) return;
  const p = players.find(x=>x.id===id);
  p.notes.push({id: uid(), date: Date.now(), text, type: noteFormType});
  await saveData(); renderDossier();
}
async function removeNote(id, noteId){
  const p = players.find(x=>x.id===id);
  p.notes = p.notes.filter(n=>n.id!==noteId);
  await saveData(); renderDossier();
}
function toggleNoteExpanded(noteId){
  if(expandedNoteIds.has(noteId)) expandedNoteIds.delete(noteId);
  else expandedNoteIds.add(noteId);
  renderDossier();
}
async function removePlayer(id){
  if(!confirm('Eliminar esta ficha de jogador? Esta ação não pode ser desfeita.')) return;
  players = players.filter(x=>x.id!==id);
  await saveData();
  closeDossier();
  render();
}
async function confirmClearAll(){
  if(!confirm('Isto vai apagar TODOS os jogadores, clubes, shortlists, jogos, Shadow Teams e Folhas Táticas da tua base de dados. Continuar?')) return;
  if(!confirm('Tens a certeza absoluta? Não é possível recuperar depois.')) return;
  players = [];
  clubs = [];
  shortlists = [];
  games = [];
  shadowTeams = [];
  tacticalSheets = [];
  activeShortlistId = null;
  activeGameId = null;
  activeShadowTeamId = null;
  activeClubId = null;
  activeTacticalSheetId = null;
  await saveData();
  render();
}

/* ---------------- init ---------------- */
async function init(){
  ghConfig = loadConfig();
  if(!ghConfig){
    renderSetupScreen();
    return;
  }
  await connectAndLoad();
}
init();
</script>
</body>
</html>
